<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Download App</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      min-height: 100vh;
      width: 100vw;
      position: relative;
      overflow-x: hidden;
      
      /* Background setup anchored to the top center */
      background-image: url('MainBackground.png');
      background-position: top center;
      background-repeat: no-repeat;
      background-size: cover;
    }

    /* Container for the buttons fixed to the bottom */
    .button-container {
      position: fixed;
      bottom: 2rem;
      left: 2rem;
      right: 2rem;
      display: flex;
      justify-content: space-between;
      align-items: center;
      z-index: 10;
    }

    .btn-link {
      display: inline-block;
      transition: transform 0.2s ease, opacity 0.2s ease;
    }

    .btn-link:hover {
      transform: scale(1.05);
      opacity: 0.9;
    }

    /* Style for the button images */
    .btn-link img {
      height: 180px; /* Kept your 180px height setting */
      width: auto;
      display: block;
    }

    /* Mobile view: stack or adjust spacing if screen is small */
    @media (max-width: 600px) {
      .button-container {
        bottom: 1.5rem;
        left: 1rem;
        right: 1rem;
      }

      .btn-link img {
        height: 48px; /* Slightly smaller on mobile screens */
      }
    }
  </style>
</head>
<body>

  <div class="button-container">
    <!-- Bottom Left: App Store -->
    <a href="https://apps.apple.com/app/pilotakada/id6793703227" target="_blank" class="btn-link">
      <img src="AppstoreButtonImg.png" alt="Download on the App Store">
    </a>

    <!-- Bottom Right: Google Play -->
    <a href="https://play.google.com/store/apps/details?id=com.aralarerdozain.pilotakada" target="_blank" class="btn-link">
      <img src="PlaystoreButtonImg.png" alt="Get it on Google Play">
    </a>
  </div>

</body>
</html>
