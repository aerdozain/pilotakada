<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Download My App</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    body {
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      color: #ffffff;
      text-align: center;
      
      /* Replace 'background.jpg' with your actual image path or URL */
      background: linear-gradient(rgba(0, 0, 0, 0.5), rgba(0, 0, 0, 0.5)), 
                  url('MainBackground.jpg') center/cover no-repeat;
    }

    h1 {
      font-size: 2.5rem;
      margin-bottom: 0.5rem;
    }

    p {
      font-size: 1.2rem;
      margin-bottom: 2rem;
      opacity: 0.9;
    }

    .btn-container {
      display: flex;
      gap: 1rem;
      flex-wrap: wrap;
      justify-content: center;
    }

    .btn {
      display: inline-block;
      padding: 0.9rem 1.8rem;
      font-size: 1rem;
      font-weight: 600;
      color: #ffffff;
      background-color: #007aff;
      border-radius: 8px;
      text-decoration: none;
      transition: background-color 0.2s ease, transform 0.1s ease;
    }

    .btn:hover {
      background-color: #0056b3;
      transform: translateY(-2px);
    }

    .btn-playstore {
      background-color: #34a853;
    }

    .btn-playstore:hover {
      background-color: #24753a;
    }
  </style>
</head>
<body>

  <h1>PILOTAKADA</h1>
  <p>Available now on iOS and Android.</p>

  <div class="btn-container">
    <a href="https://apps.apple.com/app/idYOUR_APP_ID" target="_blank" class="btn">App Store</a>
    <a href="https://play.google.com/store/apps/details?id=YOUR_PACKAGE" target="_blank" class="btn btn-playstore">Google Play</a>
  </div>

</body>
</html>
