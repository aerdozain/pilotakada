<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Download App</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      min-height: 100vh;
      width: 100vw;
      position: relative;
      overflow-x: hidden;
      
      /* Anchors the character at bottom-center while filling the screen */
      background-image: url('MainBackground.png');
      background-position: bottom center;
      background-repeat: no-repeat;
      background-size: cover;
    }

    /* Container for the Title image fixed at the top center */
    .title-container {
      position: fixed;
      top: 2rem;
      left: 50%;
      transform: translateX(-50%);
      z-index: 10;
      text-align: center;
    }

    .title-container img {
      max-width: 80vw;
      height: auto;
      max-height: 150px;
      display: block;
      object-fit: contain;
    }

    /* Container for the buttons fixed to the bottom */
    .button-container {
      position: fixed;
      bottom: 2rem;
      left: 2rem;
      right: 2rem;
      display: flex;
      justify-content: space-between;
      align-items: center;
      z-index: 10;
    }

    .btn-link {
      display: inline-block;
      transition: transform 0.2s ease, opacity 0.2s ease;
    }

    .btn-link:hover {
      transform: scale(1.05);
      opacity: 0.9;
    }

    /* Default (Desktop / Landscape) Button Styling */
    .btn-link img {
      height: 180px;
      width: auto;
      display: block;
      object-fit: contain; /* Preserves aspect ratio */
    }

    /* PORTRAIT SCREENS (Phones/Tablets in vertical mode) */
    @media (orientation: portrait) {
      .title-container {
        top: 3rem;
      }

      .title-container img {
        max-width: 85vw;
        max-height: 20vh;
      }

      .button-container {
        bottom: 2.5rem;
        left: 1.5rem;
        right: 1.5rem;
      }

      /* Dynamically size buttons while enforcing original aspect ratio */
      .btn-link img {
        width: 42vw;
        height: auto;
        max-height: 120px;
        object-fit: contain; /* Prevents image stretching */
      }
    }
  </style>
</head>
<body>

  <!-- Top Center Title -->
  <div class="title-container">
    <img src="Title.png" alt="App Title">
  </div>

  <!-- Bottom Left & Right Buttons -->
  <div class="button-container">
    <!-- Bottom Left: App Store -->
    <a href="https://apps.apple.com/app/pilotakada/id6793703227" target="_blank" class="btn-link">
      <img src="AppstoreButtonImg.png" alt="Download on the App Store">
    </a>

    <!-- Bottom Right: Google Play -->
    <a href="https://play.google.com/store/apps/details?id=com.aralarerdozain.pilotakada" target="_blank" class="btn-link">
      <img src="PlaystoreButtonImg.png" alt="Get it on Google Play">
    </a>
  </div>

</body>
</html>
